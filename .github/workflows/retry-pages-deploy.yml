name: Retry Pages deploy failures

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed deploy job
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const jobsResponse = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/jobs",
              {
                owner,
                repo,
                run_id: run.id,
              }
            );

            const deployFailed = jobsResponse.data.jobs.some(
              (job) => job.name === "deploy" && job.conclusion === "failure"
            );

            if (!deployFailed) {
              core.info("No failed 'deploy' job found. Skipping retry.");
              return;
            }

            await github.request(
              "POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs",
              {
                owner,
                repo,
                run_id: run.id,
              }
            );

            core.info(`Triggered rerun of failed jobs for run ${run.id}.`);
