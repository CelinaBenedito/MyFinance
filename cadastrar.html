<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="icon" type="image/png" href="assets/glaceonIcon.png">
    <link rel="stylesheet" href="styles/Estilos.css">
</head>

<body data-tema="padrao" data-mode="light">
    <div class="alerta" id="div_alerta">
        <div class="conteudoAlerta" id="conteudoAlerta">

        </div>
    </div>
    
    <div class="containerGeral">
        <div class="main" id="main main-formulario">
            <div class="containerCadastro">
               
                <div class="card-formulario">
                    <div class="campo full">
                         <h1>Cadastrar-se</h1>
                    </div>
                    <div class="campo">
                        <input placeholder="" type="text" id="ipt_nome" required>
                        <label>Nome</label>
                    </div>
                    <div class="campo">
                        <input placeholder=" " type="text" id="ipt_sobrenome" required>
                        <label>Sobrenome</label>
                    </div>
                    <div class="campo">
                        <input placeholder=" " id="ipt_dataNascimento" type="text" maxlength="10" inputmode="numeric" required>
                        <label>Data de Nascimento</label>
                    </div>
                    <div class="campo">
                        <select id="select_genero">
                            <option value="#">Selecione o gênero</option>
                            <option value="Homem cis">Homem cis</option>
                            <option value="Homem trans">Homem trans</option>
                            <option value="Mulher cis">Mulher cis</option>
                            <option value="Mulher trans">Mulher trans</option>
                            <option value="Não Binário">Não Binário</option>
                            <option value="Genderqueer">Genderqueer</option>
                            <option value="Agênero">Agênero</option>
                            <option value="Prefiro não informar">Prefiro não informar</option>
                            <option value="Outro">Outro</option>
                        </select>
                    </div>
                    <div class="campo full">
                        <input placeholder=" " type="email" id="ipt_email" required>
                        <label>Email</label>
                    </div>
                    <div class="campo full">
                        <input type="text" id="ipt_senha" placeholder=" " required>
                        <label>Senha</label>
                    </div>
                    <div class="campo full">
                        <input type="text" id="ipt_ConfSenha" placeholder=" " required>
                        <label>Confirmar senha</label>
                    </div>
                    <div class="campo full">
                        <button id="btn_cadastro" onclick="checarDados()">Cadastrar</button>
                    </div>
                    <div class="campo full">
                        <p>Já tem um cadastro? <a href="login.html">Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/main.js?v=2"></script>
    <script src="js/cadastrar.js?v=2"></script>
</body>
</html>
